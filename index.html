<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanchit Chalakh 😎</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Scroll Progress -->
<div id="progressBar"></div>

<!-- Music Button -->
<div class="music-toggle" onclick="toggleMusic()">🎵 Music</div>

<!-- Audio -->
<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<canvas id="particles"></canvas>

<div class="toggle" onclick="toggleMode()">Dark / Light</div>

<header>
  <div class="dp">
    <img src="sanchit.jpg" alt="Profile">
  </div>
  <h1>Sanchit Chalakh ✔</h1>
  <div class="role" id="typing"></div>
</header>

<section class="links">

  <a class="card-btn" href="#">
    <div class="left">
      <div class="icon">💬</div>
      <div><strong>WhatsApp</strong></div>
    </div>
  </a>

  <a class="card-btn" href="#">
    <div class="left">
      <div class="icon">📸</div>
      <div><strong>Instagram</strong></div>
    </div>
  </a>

  <a class="card-btn" href="#">
    <div class="left">
      <div class="icon">💻</div>
      <div><strong>GitHub</strong></div>
    </div>
  </a>

</section>

<footer>© Sanchit Chalakh</footer>

<script src="script.js"></script>
</body>
</html>
